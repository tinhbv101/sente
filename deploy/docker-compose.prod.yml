# One-VPS deployment behind an existing reverse proxy (Nginx Proxy Manager or
# similar): one server node, PostgreSQL and Redis.
#
# Only `sente` is published, and only on the loopback interface: the proxy on the
# same host reaches it at 127.0.0.1:8080, the Internet cannot. The database and
# Redis publish nothing and are reachable only from `sente` (docs/08 §10).

name: sente

services:
  sente:
    build:
      context: ../sente-server
      args:
        VERSION: ${SENTE_VERSION:-dev}
    image: sente-server:${SENTE_VERSION:-dev}
    restart: unless-stopped
    environment:
      SENTE_ADDR: ":8080"
      SENTE_DATABASE_URL: postgres://sente:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/sente?sslmode=disable
      SENTE_REDIS_URL: redis://redis:6379
      SENTE_JWT_SECRET: ${SENTE_JWT_SECRET:?set SENTE_JWT_SECRET in .env}
      SENTE_ALLOWED_ORIGINS: ${SENTE_DOMAIN:?set SENTE_DOMAIN in .env}
      # Invitation links are built from this.
      SENTE_PUBLIC_URL: https://${SENTE_DOMAIN}
      # The proxy rewrites X-Forwarded-For, so it can be believed. Never set this
      # on a node reachable without the proxy.
      SENTE_TRUST_PROXY: "true"
      # With a CDN in front of the proxy, X-Forwarded-For ends in the CDN's own
      # address. Name the header the CDN puts the real client in, or leave empty.
      SENTE_CLIENT_IP_HEADER: ${SENTE_CLIENT_IP_HEADER:-}
      SENTE_MIGRATE: "true"
      # Apple: identifiers here, the .p8 keys as read-only mounts below.
      # Shown on /privacy; leave empty to omit the contact section.
      SENTE_CONTACT_EMAIL: ${SENTE_CONTACT_EMAIL:-}
      SENTE_APPLE_TEAM_ID: ${SENTE_APPLE_TEAM_ID:-}
      SENTE_APPLE_BUNDLE_ID: ${SENTE_APPLE_BUNDLE_ID:-app.sente.go}
      # Key files default to /run/secrets/AuthKey_<KEY_ID>.p8, the name Apple
      # gives the download, so the files need no renaming.
      SENTE_APNS_KEY_ID: ${SENTE_APNS_KEY_ID:-}
      SENTE_APNS_KEY_FILE: ${SENTE_APNS_KEY_FILE:-}
      SENTE_SIWA_KEY_ID: ${SENTE_SIWA_KEY_ID:-}
      SENTE_SIWA_KEY_FILE: ${SENTE_SIWA_KEY_FILE:-}
    # The secrets directory is git-ignored. The container runs as a non-root user,
    # so the directory needs the traverse bit for others (711) and the files 644.
    volumes:
      - ${SENTE_SECRETS_DIR:-./secrets}:/run/secrets:ro
    # Loopback only. Widening SENTE_BIND to 0.0.0.0 exposes the server directly,
    # bypassing the proxy, its TLS, and ufw (Docker writes its own iptables rules).
    ports:
      - "${SENTE_BIND:-127.0.0.1}:${SENTE_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless has no shell and no curl, so the binary answers for itself.
      test: ["CMD", "/sente-server", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    # SIGTERM starts the drain: games are handed over before the process exits,
    # so give it room to finish (docs/04 §5.2).
    stop_grace_period: 45s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sente
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sente -d sente"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Leases and routing are all recoverable, so persistence buys nothing here.
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
