# xcodegen spec. `xcodegen generate` produces Sente.xcodeproj; the project file is
# not committed, this is.
name: Sente
options:
  bundleIdPrefix: app.sente
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  GoKit:
    path: Packages/GoKit
  SenteNet:
    path: Packages/SenteNet
  SenteUI:
    path: Packages/SenteUI
targets:
  Sente:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GoKit
      - package: SenteNet
      - package: SenteUI
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sente
        CFBundleName: Sente
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # sente://j/<code> opens an invitation; universal links need an AASA file on
        # the server domain and come later.
        CFBundleURLTypes:
          - CFBundleURLName: app.sente.go
            CFBundleURLSchemes: [sente]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sente.go
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
schemes:
  Sente:
    build:
      targets:
        Sente: all
    run:
      config: Debug
