# Local development stack. Tests do not use this file -- they start their own
# throwaway containers -- so wiping these volumes is always safe.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sente
      POSTGRES_PASSWORD: sente
      POSTGRES_DB: sente
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sente -d sente"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
