# xcodegen spec. `xcodegen generate` produces Sente.xcodeproj; the project file is
# not committed, this is.
name: Sente
options:
  bundleIdPrefix: app.sente
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Apple Developer Team ID (Membership details). Needed for push, Sign in
    # with Apple and universal links; simulator builds ignore it.
    DEVELOPMENT_TEAM: H4XS3XWJ9N
    CODE_SIGN_STYLE: Automatic
packages:
  GoKit:
    path: Packages/GoKit
  SenteNet:
    path: Packages/SenteNet
  SenteUI:
    path: Packages/SenteUI
targets:
  Sente:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GoKit
      - package: SenteNet
      - package: SenteUI
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Sente
        CFBundleName: Sente
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Sente dùng camera để quét mã QR của lời mời.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # sente://j/<code> opens an invitation. https://sente.devlord.net/j/<code>
        # does too, through the associated domain in Sente.entitlements.
        CFBundleURLTypes:
          - CFBundleURLName: app.sente.go
            CFBundleURLSchemes: [sente]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sente.go
        CODE_SIGN_ENTITLEMENTS: App/Resources/Sente.entitlements
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  SenteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/SenteTests
    dependencies:
      - target: Sente
      - package: GoKit
      - package: SenteNet
      - package: SenteUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.sente.go.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sente:
    build:
      targets:
        Sente: all
        SenteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SenteTests
